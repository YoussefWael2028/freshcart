<div class="flex flex-wrap full">
@for (product of products; track product.id) {
<div class="sm:w-1/2 md:w-1/3 lg:w-1/5 p-2">
    <app-product-item
      (productIdEmitter)="addToCart($event)"
      (wishlistIdEmitter)="toggleWishlist($event)"
      [callingApi]="callingApi"
      [calledId]="calledId"
      [isWishlisted]="isInWishlist(product.id)"
      [product]="product"/>
</div>
}
</div>
