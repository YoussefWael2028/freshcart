<div class="fixed top-20 right-4 z-[9999] flex flex-col gap-3">
  @for (toast of (toasts$ | async); track toast.id) {
    <div
      class="bg-green-500 text-white px-5 py-4 rounded-lg shadow-lg flex items-center gap-3 min-w-[280px]"
      [class.toast-enter]="!toast.leaving"
      [class.toast-leave]="toast.leaving">
      <i class="fa fa-check-circle text-xl"></i>
      <span class="flex-1">{{toast.message}}</span>
      <span class="text-xl">{{toast.icon}}</span>
    </div>
  }
</div>
