<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<div class="w-full product  bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700 relative">
 <a [routerLink]="'/productDetails/'+product.id">
        <img class="p-8 rounded-t-lg" [src]="product.imageCover" alt="product image" />

<div class="px-5 pb-5">
    <span class="text-sm text-green-600 font-medium">{{product.category.name}}</span>
    <a href="#">
        <h5 class="text-xl font-semibold tracking-tight text-gray-900 dark:text-white">{{product.title.split(" ").slice(0,2).join(" ")}}</h5>
    </a>
    <div class="flex items-center justify-between mt-2">
        <span class="text-3xl font-bold text-gray-900 dark:text-white">{{product.price}}</span>
        <span class="flex items-center gap-1">
            <i class="fa fa-star text-yellow-400"></i>
            <span class="text-gray-600">{{product.ratingsAverage}}</span>
        </span>
    </div>
</div>
</a>
<button (click)="toggleWishlist(product.id)" class="absolute top-3 right-3 text-xl">
  <i class="fa fa-heart" [class.text-red-500]="isWishlisted" [class.text-gray-400]="!isWishlisted"></i>
</button>
<button class="btn" (click)="addToCart(product.id)">
    @if (callingApi) {
   <i class="fa fa-spin fa-spinner"></i>
 } @else {
   +Add to cart
 }
</button>
</div>
