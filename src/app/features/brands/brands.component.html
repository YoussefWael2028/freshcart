@if (isLoading) {
  <div class="flex justify-center items-center py-20">
    <i class="fa fa-spin fa-spinner text-4xl text-green-600"></i>
  </div>
} @else {
  <div class="container mx-auto px-4 py-8">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
      @for (brand of brands; track brand._id) {
        <a [routerLink]="['/products']" [queryParams]="{brand: brand._id, name: brand.name}"
           class="bg-white border border-gray-200 rounded-lg shadow-sm p-4 flex flex-col items-center text-center hover:shadow-md transition-shadow cursor-pointer">
          <img [src]="brand.image" [alt]="brand.name" class="h-32 w-full object-contain mb-3" />
          <span class="font-medium text-gray-800">{{brand.name}}</span>
        </a>
      }
    </div>
  </div>
}
