<div class="container mx-auto px-4 pt-8">
  <input
    type="text"
    placeholder="search...."
    (input)="onSearch($any($event.target).value)"
    class="w-full max-w-3xl mx-auto block border border-gray-300 rounded-lg px-4 py-3 mb-8 focus:outline-none focus:ring-2 focus:ring-green-500" />
</div>
@if (isLoading) {
  <div class="flex justify-center items-center py-20">
    <i class="fa fa-spin fa-spinner text-4xl text-green-600"></i>
  </div>
} @else {
  <div class="container mx-auto px-4 py-8">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      @for (product of products; track product.id) {
        <app-product-item
         [product]="product"
         [callingApi]="callingApi"
         [calledId]="calledId"
         [isWishlisted]="isInWishlist(product.id)"
         (productIdEmitter)="addToCart($event)"
         (wishlistIdEmitter)="toggleWishlist($event)">
</app-product-item>
      }
    </div>
  </div>
}
